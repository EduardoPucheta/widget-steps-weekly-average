name: Release

# Tagging is the trigger. Pushing v1.2.0 builds that version, signs it and
# publishes it as a GitHub Release, which is what Obtainium watches on the phone.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the Release and upload the APK to it.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version name comes from the tag and the version code
          # from the commit count, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install the SDK packages this project builds against
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0"

      - name: Run the checks
        # Before signing anything. A release that fails its own tests should never
        # reach a phone that installs updates on its own.
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See the release section of the README."
            exit 1
          fi
          # RUNNER_TEMP, not the workspace: nothing that could be archived or cached.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$src" ]; then echo "::error::no APK produced"; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          out="weekly-steps-${version}.apk"
          mv "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Verify it is actually signed
        # A release signed with the debug key, or not signed at all, installs once
        # and can never be updated. Cheaper to catch here than on the phone.
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/36.0.0)
          certs=$("$bt/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
